name: Fork validation and image

on:
  push:
    branches: [production, 'fork/**']
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'mergebloom/honcho'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.24'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Provider, protocol and routing regressions (no live credentials)
        run: uv run --frozen pytest tests/llm tests/utils/test_clients.py -q -n 0
      - name: Validate fork Python
        run: |
          uv run --frozen ruff check src/llm/codex_oauth.py tests/llm/test_codex_oauth.py
          uv run --frozen ruff format --check src/llm/codex_oauth.py tests/llm/test_codex_oauth.py
          uv run --frozen basedpyright src/llm/codex_oauth.py
          git diff --check
  image:
    if: github.repository == 'mergebloom/honcho' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mergebloom/honcho:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mergebloom/honcho
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Immutable release identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          printf 'revision=%s\nimage=ghcr.io/mergebloom/honcho@%s\n' "$REVISION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
